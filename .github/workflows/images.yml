name: Publish images

on:
  workflow_dispatch:
    inputs:
      fnn-version:
        description: FNN release to build, e.g. 0.9.1. Empty uses the pinned version.
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      FIBER_LAB_FNN_VERSION: ${{ inputs.fnn-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: images
        run: npx tsx scripts/image-tags.ts >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: topology/docker
          file: topology/docker/fnn.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: FNN_VERSION=${{ steps.images.outputs.fnn_version }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.images.outputs.fnn }}
          push: true
      - uses: docker/build-push-action@v6
        with:
          context: topology/docker
          file: topology/docker/ckb.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            FNN_VERSION=${{ steps.images.outputs.fnn_version }}
            CKB_VERSION=${{ steps.images.outputs.ckb_version }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ steps.images.outputs.ckb }}
          push: true
