name: CI

on:
  pull_request:
  push:
    branches: [canary, main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  # One job fetches the FNN release for each version; the rest load it from the cache.
  images:
    needs: unit
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - fnn: "0.9.1"
            experimental: false
          - fnn: "0.10.0-rc2"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          fnn-version: ${{ matrix.fnn }}
          prepare-only: "true"

  consumer:
    needs: unit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:consumer

  python-example:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./
        with:
          prepare-only: "true"
      - run: python -m unittest discover -s examples/python -v
        env:
          FIBER_LAB_CLI: npm run -s lab --

  scenarios:
    needs: images
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - fnn: "0.9.1"
            experimental: false
          - fnn: "0.10.0-rc2"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          all: "true"
          fnn-version: ${{ matrix.fnn }}
          artifact-name: fiber-lab-results-${{ matrix.fnn }}

  test-kit:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          prepare-only: "true"
      - run: npm run test:integration
      - name: Upload run-logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-kit-run-logs
          path: .fiber-lab/runs/
          if-no-files-found: ignore
