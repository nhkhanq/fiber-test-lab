name: channel-drain
description: Repeated payments drain Alice's outbound until one fails with insufficient_outbound
tags: [failure, payment]
nodes: [alice, bob]
channels:
  - from: alice
    to: bob
    capacity: 500
seed:
  - action: send_payment
    from: alice
    to: bob
    amount: 100
    expect:
      status: succeeded
  - action: send_payment
    from: alice
    to: bob
    amount: 100
    expect:
      status: succeeded
  - action: send_payment
    from: alice
    to: bob
    amount: 100
    expect:
      status: succeeded
  - action: send_payment
    from: alice
    to: bob
    amount: 100
    expect:
      status: succeeded
  - action: send_payment
    from: alice
    to: bob
    amount: 100
    expect:
      status: failed
      reason: insufficient_outbound
      balances:
        - { node: alice, peer: bob, remote: 400, localDelta: 0 }
expect:
  status: failed
  reason: insufficient_outbound
