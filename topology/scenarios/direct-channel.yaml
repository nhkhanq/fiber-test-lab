name: direct-channel
description: Alice pays Bob over a single direct channel
tags: [smoke, payment]
nodes: [alice, bob]
channels:
  - from: alice
    to: bob
    capacity: 500
seed:
  - action: send_payment
    from: alice
    to: bob
    amount: 100
    expect:
      status: succeeded
      fee: 0
      balances:
        - { node: alice, peer: bob, local: 301, remote: 100, localDelta: -100 }
        - { node: bob, peer: alice, local: 100, remote: 301, localDelta: 100 }
expect:
  status: succeeded
